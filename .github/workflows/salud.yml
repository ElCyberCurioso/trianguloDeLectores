# Vigilancia de producción entre despliegues.
#
# La única comprobación que había vivía dentro del job de despliegue: corría
# mientras se publicaba y nunca más. Si producción se caía un martes por la
# tarde, se enteraba quien pasara por allí.
#
# Esto no sustituye a un Health Check de Cloudflare —que mira desde varias
# regiones y avisa en minutos—, pero no depende del panel, queda en el
# repositorio y abre un issue con el fallo dentro.
name: Salud

on:
  schedule:
    # Cada 30 minutos. GitHub no garantiza la puntualidad de los crons y en
    # horas punta los retrasa: para vigilancia vale, para alertas de segundos no.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comprobar:
    name: ¿Responde producción?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir /health
        id: salud
        run: |
          set +e
          # Tres intentos espaciados: un fallo suelto puede ser un despliegue en
          # curso o un corte de red del propio runner, y un issue por cada uno
          # sería ruido que acaba ignorándose.
          for intento in 1 2 3; do
            cuerpo=$(curl -sS --max-time 15 -w '\n%{http_code}' https://triangulodelectores.site/health)
            codigo=$(printf '%s' "$cuerpo" | tail -n1)
            json=$(printf '%s' "$cuerpo" | sed '$d')
            if [ "$codigo" = "200" ] && printf '%s' "$json" | grep -q '"ok":true'; then
              echo "Intento $intento: correcto ($codigo)"
              exit 0
            fi
            echo "Intento $intento: código=$codigo cuerpo=$json"
            [ "$intento" -lt 3 ] && sleep 20
          done
          {
            echo "codigo=$codigo"
            echo "cuerpo<<FIN"
            printf '%s\n' "$json"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"
          exit 1

      - name: Abrir issue si no responde
        if: failure()
        uses: actions/github-script@v7
        env:
          CODIGO: ${{ steps.salud.outputs.codigo }}
          CUERPO: ${{ steps.salud.outputs.cuerpo }}
        with:
          script: |
            const titulo = 'Producción no responde en /health';
            // Un solo issue abierto por incidencia: si ya hay uno, se comenta en
            // él. Abrir uno cada media hora enterraría el resto del tablero.
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'salud',
            });
            const detalle = [
              `Comprobación automática del ${new Date().toISOString()}.`,
              '',
              `- Código HTTP: \`${process.env.CODIGO || 'sin respuesta'}\``,
              `- Cuerpo: \`${(process.env.CUERPO || '').slice(0, 500) || 'vacío'}\``,
              '',
              `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const existente = abiertos.data.find((issue) => issue.title === titulo);
            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: detalle,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: detalle,
              labels: ['salud'],
            });
