# El despliegue automático corre con `master`, que es la rama de este
# repositorio. Estuvo escrito `main` —el nombre por omisión de GitHub— desde el
# principio, así que este workflow **no se ejecutó nunca**: producción se
# desplegaba a mano y nadie veía que el CI no hacía nada.
#
# Necesita cuatro secretos en el repositorio. **Sin ellos no se despliega, pero
# tampoco falla**: los jobs que los necesitan se saltan y el job `secretos` deja
# dicho en el resumen cuáles faltan. Antes fallaban, y un semáforo que está
# siempre en rojo deja de significar nada.
#   CLOUDFLARE_API_TOKEN   token con permiso de editar Workers, D1 y R2
#   CLOUDFLARE_ACCOUNT_ID  identificador de la cuenta
#   E2E_ADMIN_EMAIL        cuenta de pruebas contra staging
#   E2E_ADMIN_PASSWORD
#
# Se ponen en Settings -> Secrets and variables -> Actions -> New repository
# secret. En cuanto estén los dos de Cloudflare, el despliegue se enciende solo.
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Un despliegue a la vez: evita carreras entre dos merges seguidos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # -------------------------------------------------------------- credencial --
  # Un secreto no se puede leer desde un `if:` de job, así que hay que mirarlo
  # en un paso y sacarlo por `outputs`. Sólo se publica si está o no está:
  # nunca su valor.
  secretos:
    name: ¿Hay credenciales para desplegar?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloudflare: ${{ steps.mirar.outputs.cloudflare }}
      e2e: ${{ steps.mirar.outputs.e2e }}
    steps:
      - id: mirar
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORREO: ${{ secrets.E2E_ADMIN_EMAIL }}
          CLAVE: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${TOKEN:-}" ] && [ -n "${CUENTA:-}" ]; then
            echo "cloudflare=si" >> "$GITHUB_OUTPUT"
            echo "Credenciales de Cloudflare presentes: se desplegará." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cloudflare=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sin desplegar::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID; los despliegues se saltan."
            {
              echo "### No se despliega"
              echo
              echo "Faltan \`CLOUDFLARE_API_TOKEN\` y/o \`CLOUDFLARE_ACCOUNT_ID\`."
              echo "Se ponen en Settings -> Secrets and variables -> Actions."
              echo "Mientras tanto hay que desplegar a mano con \`npx wrangler deploy --env production\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${CORREO:-}" ] && [ -n "${CLAVE:-}" ]; then
            echo "e2e=si" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sin E2E::Faltan E2E_ADMIN_EMAIL y/o E2E_ADMIN_PASSWORD; las pruebas E2E se saltan."
          fi

  # --------------------------------------------------------------- calidad --
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Buscar secretos en el repositorio
        run: npm run secrets:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Antes de los tests de integración, no después: el subdominio privado
      # sirve `/assets/books.js` desde `public/`, y hay una prueba que comprueba
      # que se sirve sin sesión. Sin compilar, ese fichero no existe y el test
      # falla por una razón que no tiene nada que ver con lo que prueba. En
      # local no se veía porque el bundle ya estaba ahí de compilarlo a mano.
      - name: Compilar las islas de cliente
        run: npm run build:client

      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests de integración (workerd + D1 + R2 + KV + DO)
        run: npm run test:integration

      - name: Build (dry-run del Worker)
        run: npm run build

  # ---------------------------------------------------------------- staging --
  deploy-staging:
    name: Desplegar en staging
    needs: [quality, secretos]
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.secretos.outputs.cloudflare == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.triangulodelectores.site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build:client

      - name: Aplicar migraciones en staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --env staging --remote

      - name: Desplegar Worker (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  # -------------------------------------------------------------------- e2e --
  e2e:
    name: E2E contra staging
    needs: [deploy-staging, secretos]
    if: needs.secretos.outputs.e2e == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://staging.triangulodelectores.site
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Ejecutar Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ------------------------------------------------------------- producción --
  deploy-production:
    name: Desplegar en producción
    needs: [quality, secretos, deploy-staging, e2e]
    # Un E2E **saltado** por falta de cuenta de pruebas no bloquea; uno que
    # falla, sí. Si no, poner sólo los dos secretos de Cloudflare dejaría
    # producción sin desplegar nunca y sin decir por qué.
    if: >-
      always() &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.secretos.outputs.cloudflare == 'si' &&
      needs.quality.result == 'success' &&
      needs['deploy-staging'].result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requiere aprobación manual si el entorno de GitHub tiene revisores.
    environment:
      name: production
      url: https://triangulodelectores.site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build:client

      # Migraciones aditivas. Nunca destructivas de forma automática:
      # cualquier DROP/ALTER que pierda datos se aplica a mano y con backup.
      - name: Aplicar migraciones en producción
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --env production --remote

      - name: Desplegar Worker (producción)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Comprobación de humo
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS https://triangulodelectores.site/health | grep -q '"ok":true'; then
              echo "Producción responde correctamente."
              exit 0
            fi
            echo "Reintento $i..."
            sleep 10
          done
          echo "La comprobación de humo ha fallado." >&2
          exit 1
