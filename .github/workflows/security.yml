name: Seguridad

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría de dependencias y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Lo que se audita de verdad es **lo que se empaqueta**, que son tres
      # dependencias: hono, zod y drizzle-orm. Esto tiene que estar limpio.
      - name: npm audit de lo que va dentro del Worker
        run: npm audit --omit=dev --audit-level=high

      # El resto del árbol es herramienta —wrangler, vitest-pool-workers— y no
      # llega al Worker: sus avisos son de `undici` y `ws`, que ni se despliegan
      # ni escuchan nada aquí, y arreglarlos pide un salto de versión mayor de
      # la propia herramienta. Auditarlo todo junto y en bloqueante dejó el
      # semáforo en rojo permanente, que es la forma segura de que un aviso de
      # verdad pase desapercibido. Se sigue mirando, pero informando.
      - name: npm audit de las herramientas (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Escaneo de secretos del repositorio
        run: npm run secrets:check

      - name: Comprobar que no se usan APIs de Node en el Worker
        run: |
          set -euo pipefail
          if grep -rnE "from '(node:)?(fs|child_process|net|tls|dns|cluster|worker_threads)'" src/server src/do src/db; then
            echo "Se ha detectado una API de Node no disponible en Workers." >&2
            exit 1
          fi
          echo "El código del Worker sólo usa APIs Web estándar."
